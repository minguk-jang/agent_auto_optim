test_cases:
  # Easy - 정보 완전함
  - id: tc_001
    query: "내일 오후 3시 강남역 스타벅스에서 팀 회의"
    context:
      user_intent: "팀 회의 일정 생성"
      ground_truth:
        title: "팀 회의"
        date: "내일"
        time: "15:00"
        location: "강남역 스타벅스"
    max_turns: 1

  # Easy - 하나만 빠짐 (location 없음)
  - id: tc_002
    query: "금요일 점심에 병원"
    context:
      user_intent: "병원 방문 일정"
      ground_truth:
        title: "병원"
        date: "금요일"
        time: "12:00"
        location: ~
    max_turns: 2

  # Medium - 모호한 표현
  - id: tc_003
    query: "다음주 언젠가 치과 가야되는데"
    context:
      user_intent: "치과 예약"
      ground_truth:
        title: "치과"
        date: "다음주"
        time: ~
        location: ~
    max_turns: 3

  # Medium - 여러 개 빠짐
  - id: tc_004
    query: "면접 잡아줘"
    context:
      user_intent: "면접 일정 생성"
      ground_truth:
        title: "면접"
        date: ~
        time: ~
        location: ~
    max_turns: 4

  # Hard - 비문/줄임말
  - id: tc_005
    query: "ㅇㅇ 저녁 약속 ㄱㄱ"
    context:
      user_intent: "저녁 약속 일정"
      ground_truth:
        title: "저녁 약속"
        date: "오늘"
        time: "저녁"
        location: ~
    max_turns: 3


slot_schema:
  - name: title
    required: true
    description: "일정 제목"
  - name: date
    required: true
    description: "날짜"
  - name: time
    required: false
    description: "시간"
  - name: location
    required: false
    description: "장소"
